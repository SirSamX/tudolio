[package]
name = "tudolio"
# authors = ["Graydon Hoare", "Fnu Lnu <no-reply@rust-lang.org>"]
version = "0.1.0"
edition = "2024"
description = "A simple, lightweight terminal-based todo manager"
readme = "README.md"
homepage = "https://github.com/SirSamX/todo"
repository = "https://github.com/SirSamX/todo"
license = "MIT"
keywords = ["todo", "cli", "terminal", "task-manager"]
categories = ["command-line-utilities"]

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
